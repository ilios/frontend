version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      artifact:
        patterns:
          - "*-artifact"

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: "wednesday"
    open-pull-requests-limit: 10
    groups:
      ember-data:
        patterns:
          - "@ember-data/*"
          - "@warp-drive/*"
      ember-intl:
        patterns:
          - "ember-intl"
          - "@ember-intl/*"
      fontawesome:
        patterns:
          - "@fortawesome/*"
      stylelint:
        patterns:
          - "stylelint"
          - "stylelint-*"
    ignore:
      - dependency-name: "@fortawesome/*"
        versions: [ "7" ]
      - dependency-name: "@babel/core"
      - dependency-name: "@babel/eslint-parser"
      - dependency-name: "@babel/plugin-transform-runtime"
      - dependency-name: "@babel/runtime"
      - dependency-name: "@ember/optional-features"
      - dependency-name: "@ember/string"
      - dependency-name: "@ember/test-helpers"
      - dependency-name: "@ember/test-waiters"
      - dependency-name: "@embroider/compat"
      - dependency-name: "@embroider/config-meta-loader"
      - dependency-name: "@embroider/core"
      - dependency-name: "@embroider/legacy-inspector-support"
      - dependency-name: "@embroider/macros"
      - dependency-name: "@embroider/router"
      - dependency-name: "@embroider/vite"
      - dependency-name: "@eslint/js"
      - dependency-name: "@glimmer/component"
      - dependency-name: "@rollup/plugin-babel"
      - dependency-name: babel-plugin-ember-template-compilation
      - dependency-name: concurrently
      - dependency-name: decorator-transforms
      - dependency-name: ember-cli
      - dependency-name: ember-cli-babel
      - dependency-name: ember-cli-deprecation-workflow
      - dependency-name: ember-load-initializers
      - dependency-name: ember-modifier
      - dependency-name: ember-page-title
      - dependency-name: ember-qunit
      - dependency-name: ember-resolver
      - dependency-name: ember-source
      - dependency-name: ember-template-lint
      - dependency-name: eslint
      - dependency-name: eslint-config-prettier
      - dependency-name: eslint-plugin-ember
      - dependency-name: eslint-plugin-n
      - dependency-name: eslint-plugin-qunit
      - dependency-name: globals
      - dependency-name: prettier
      - dependency-name: prettier-plugin-ember-template-tag
      - dependency-name: qunit
      - dependency-name: qunit-dom
      - dependency-name: testem
      - dependency-name: vite
