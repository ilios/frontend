name: Deploy Production Build

permissions:
  contents: read

on:
  push:
    tags:
      - "*"

jobs:
  deploy-frontend:
    name: Deploy Frontend and Create Sentry Release
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_PRODUCTION_DEPLOY_ARN }}
          aws-region: ${{ vars.AWS_DEPLOY_REGION }}
          allowed-account-ids: ${{ vars.AWS_ACCOUNT_ID }}
          role-duration-seconds: 900
          role-session-name: deploy-production-${{ github.run_id }}-${{ github.run_attempt }}
          unset-current-credentials: true
      - name: Ember CLI Deploy
        timeout-minutes: 30
        run: pnpm run deploy:production
      - name: Install Sentry CLI
        run: pnpm install -g @sentry/cli
      - name: Create Sentry release
        uses: getsentry/action-release@v3
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ilios
          SENTRY_PROJECT: frontend
        with:
          release: ${{github.ref}}
          sourcemaps: tmp/deploy-dist/
      - uses: act10ns/slack@v2
        if: failure()
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_ILIOS_DEPLOYMENT_WEBHOOK_URL }}
        with:
          status: ${{ job.status }}
          message: Frontend Production Deploy Failed {{ env.GITHUB_SERVER_URL }}/{{ env.GITHUB_REPOSITORY }}/actions/runs/{{ env.GITHUB_RUN_ID }}
