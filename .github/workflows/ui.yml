name: Browser Tests

permissions:
  contents: read

on:
  pull_request:

concurrency:
  group: ui-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

env:
  SW_DISABLED: true
  EMBER_EXAM_CONCURRENCY: 3

jobs:
  firefox-test:
    name: Firefox Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        firefox-version: [latest-esr]
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install
      - name: Setup firefox
        uses: browser-actions/setup-firefox@latest
        with:
          firefox-version: ${{ matrix.firefox-version }}
      - run: firefox --version
      - name: test
        run: pnpm run test --write-execution-file --launch=Firefox
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: replay-firefox-${{ matrix.firefox-version }}.json
          path: ./test-execution-*.json
          retention-days: 7

  safari-test:
    name: Safari Tests
    runs-on: macos-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        partition:
          - 1
          - 2
          - 3
          - 4
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install
      - name: Safari Version
        run: /usr/libexec/PlistBuddy -c "print :CFBundleShortVersionString" /Applications/Safari.app/Contents/Info.plist
      - name: test
        run: pnpm exec ember exam --split=4 --partition=${{ matrix.partition }} --launch=SafariApplescript
