name: Deploy Pull Request

permissions:
  contents: read

on:
  pull_request_target:
    types: [labeled]

jobs:
  deploy:
    name: Deploy PR Preview
    runs-on: ubuntu-latest
    timeout-minutes: 60
    if: contains(github.event.pull_request.labels.*.name, 'safe to deploy')
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          allow-unsafe-pr-checkout: true
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_STAGING_DEPLOY_ARN }}
          aws-region: ${{ vars.AWS_DEPLOY_REGION }}
          allowed-account-ids: ${{ vars.AWS_ACCOUNT_ID }}
          role-duration-seconds: 900
          role-session-name: deploy-pr-${{ github.run_id }}-${{ github.run_attempt }}
          unset-current-credentials: true
      - name: Ember CLI Deploy
        timeout-minutes: 30
        run: pnpm run deploy:pr-preview
        env:
          GITHUB_PR_NUMBER: ${{ github.event.number }}
      - uses: act10ns/slack@v2
        if: failure()
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_ILIOS_DEPLOYMENT_WEBHOOK_URL }}
        with:
          status: ${{ job.status }}
          message: PR ${{ github.event.number }} Deploy Failed {{ env.GITHUB_SERVER_URL }}/{{ env.GITHUB_REPOSITORY }}/actions/runs/{{ env.GITHUB_RUN_ID }}

  comment:
    permissions:
      issues: write
      pull-requests: write
    runs-on: ubuntu-latest
    needs: deploy
    steps:
      - uses: actions/github-script@v9
        with:
          github-token: ${{secrets.GITHUB_TOKEN}}
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: "Staging build deployed! It can be accessed with `bin/console ilios:update-frontend --staging-build --at-version=pr_preview-${{ github.event.number }}`"
            })
